<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 { text-align: center; color: #333; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #6366f1; box-shadow: 0 0 8px rgba(99,102,241,0.2); }

        button {
            width: 100%;
            background: linear-gradient(to right, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { transform: translateY(-2px); opacity: 0.9; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Thêm Khóa Học</h2>

    <form th:action="@{/admin/courses/save}" th:object="${course}" method="post">

        <div class="form-group">
            <label>Tên môn học</label>
            <input type="text" th:field="*{name}" placeholder="Ví dụ: Lập trình Java" required>
        </div>

        <div class="form-group">
            <label>Số tín chỉ</label>
            <input type="number" th:field="*{credits}" placeholder="Ví dụ: 3" required>
        </div>

        <button type="submit">Lưu Khóa Học ✨</button>

        <a href="/admin/courses" class="back-link"> Quay lại danh sách</a>
    </form>
</div>

</body>
</html>
